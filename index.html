

<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muhammadziyo Vohidjon O‘g‘li | Kitoblar</title>
<style>
:root {
  --cream:#f8f4eb;
  --beige:#eee4d3;
  --gold:#b38b50;
  --green:#687d64;
  --ink:#302f29;
  --muted:#777267;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:Arial,sans-serif;line-height:1.7
}
a{color:inherit;text-decoration:none}
.container{width:min(1120px,90%);margin:auto}
nav{
  position:sticky;top:0;z-index:5;background:#f8f4ebed;
  backdrop-filter:blur(12px);border-bottom:1px solid #e5dac8
}
.navrow{display:flex;justify-content:space-between;align-items:center;
  gap:18px;padding:18px 0;flex-wrap:wrap}
.logo{font-family:Georgia,serif;font-size:22px;font-weight:bold}
.logo span{color:var(--gold)}
.links{display:flex;gap:17px;flex-wrap:wrap;font-size:13px}
.links a:hover{color:var(--gold)}
.btn{
 display:inline-block;padding:12px 20px;border-radius:30px;
 background:var(--green);color:white;border:1px solid var(--green);
 font-size:13px;font-weight:bold;transition:.25s
}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 25px #687d6433}
.btn.alt{background:transparent;color:var(--ink);border-color:#cbbb9f}
.hero{
 padding:75px 0;background:
 radial-gradient(ellipse at 85% 25%,#e7ddc6,transparent 42%),
 linear-gradient(120deg,#fbf8f1,#f0ebdf)
}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:45px;align-items:center}
.eyebrow{color:var(--green);font-size:11px;letter-spacing:3px;font-weight:bold}
h1,h2,h3{font-family:Georgia,serif;font-weight:normal}
h1{font-size:clamp(42px,6vw,70px);line-height:1.1;margin:20px 0}
h1 em{color:var(--green)}
h2{font-size:clamp(30px,4vw,45px);line-height:1.2;margin:12px 0 18px}
p{color:var(--muted)}
.hero p{max-width:540px}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.portrait{
  min-height:410px;border-radius:220px 220px 24px 24px;
  background:linear-gradient(145deg,#e6ddcc,#dce4d7);
  border:10px solid #fffaf1;box-shadow:0 25px 55px #50442d18;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  position:relative;animation:float 5s ease-in-out infinite
}
.portrait img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}
.placeholder{text-align:center;padding:30px;color:var(--green)}
.placeholder b{font-family:Georgia,serif;font-size:64px;display:block;color:var(--gold)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
section{padding:76px 0}
.altbg{background:#fffdf8}
.head{margin-bottom:30px}
.head p{max-width:600px}
.about{display:grid;grid-template-columns:.7fr 1.3fr;gap:35px;align-items:center}
.about-card{padding:28px;background:var(--beige);border-radius:20px;text-align:center}
.about-card strong{font-family:Georgia,serif;font-size:23px}
.note{padding:13px 16px;background:#f0e9db;border-left:3px solid var(--gold);font-size:12px}
.books{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.book{
 background:#fff;border:1px solid #e9dfce;border-radius:17px;
 padding:12px;transition:transform .35s,box-shadow .35s;
}
.book:hover{transform:translateY(-9px) rotateY(-3deg);box-shadow:0 22px 40px #4037251b}
.cover{
 height:260px;overflow:hidden;border-radius:10px;
 background:linear-gradient(145deg,#e0e8db,#f0e0c4);
 display:flex;align-items:center;justify-content:center;
 position:relative;box-shadow:5px 8px 14px #302f2915
}
.cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cover:after{content:"";position:absolute;inset:0;
 background:linear-gradient(110deg,transparent 25%,#ffffff70 48%,transparent 65%);
 transform:translateX(-130%);transition:transform .8s}
.book:hover .cover:after{transform:translateX(130%)}
.covertext{text-align:center;padding:16px;color:#52654e;position:relative;z-index:1}
.covertext small{font-size:9px;letter-spacing:1px}
.covertext b{display:block;font-family:Georgia,serif;font-size:20px;line-height:1.3;margin:15px 0}
.book h3{font-size:19px;line-height:1.3;margin:15px 3px 8px}
.book p{font-size:12px;margin:0 3px 14px;min-height:62px}
.bookbottom{border-top:1px solid #eee6d8;padding:12px 3px 3px;
 display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-size:11px;font-weight:bold;color:var(--green)}
.bookbottom a{font-size:11px;color:var(--gold);font-weight:bold}
.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.benefit{background:white;border:1px solid #e8e0d2;padding:23px;border-radius:16px}
.benefit span{font-size:25px}
.benefit h3{font-size:20px;margin:12px 0 7px}
.benefit p{font-size:13px;margin:0}
.videos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.video{background:white;padding:10px;border:1px solid #e7dfd1;border-radius:15px}
.video video{width:100%;aspect-ratio:9/14;object-fit:cover;background:var(--beige);border-radius:10px}
.video p{font-size:12px}
.faq{max-width:850px}
details{border-bottom:1px solid #e5ddcf;padding:18px 0}
summary{cursor:pointer;font-weight:bold;display:flex;justify-content:space-between;gap:15px}
summary:after{content:"+";color:var(--gold);font-size:22px}
details[open] summary:after{content:"−"}
details p{font-size:14px;margin:12px 25px 0 0}
.afif{
 background:#e7ebdf;border-radius:23px;padding:35px;
 display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:center
}
.afif-art{
 min-height:200px;border-radius:17px;background:linear-gradient(145deg,#f8f3e7,#dce4d6);
 display:grid;place-items:center;text-align:center;color:var(--green)
}
.afif-art strong{font:48px Georgia,serif}
footer{padding:30px 0;background:#eee8dc;font-size:12px}
footer p{margin:5px 0}
@media(max-width:850px){
 .hero-grid{grid-template-columns:1fr 1fr;gap:25px}
 .books{grid-template-columns:repeat(2,minmax(0,1fr))}
 .cover{height:290px}
 .links{gap:10px}
}
@media(max-width:600px){
 .hero-grid,.about,.afif{grid-template-columns:1fr}
 .hero{padding:45px 0}
 .portrait{min-height:340px;max-width:330px;width:100%;margin:auto}
 section{padding:55px 0}
 .books{gap:10px}
 .cover{height:205px}
 .book{padding:9px}
 .book h3{font-size:16px}
 .book p{font-size:11px;min-height:75px}
 .benefits{grid-template-columns:1fr 1fr;gap:10px}
 .benefit{padding:15px}
 .videos{grid-template-columns:1fr 1fr}
 .navrow{align-items:flex-start}
 .links{width:100%;font-size:12px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

</div>
</div></nav>
